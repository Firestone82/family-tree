# Lints, tests and builds every push and pull request; publishes master to GitHub Pages.
#
# One-time setup in the repository: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (ESLint, TypeScript and templates)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Validate the example file against the XML schema
        run: |
          command -v xmllint >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils)
          xmllint --noout --schema schema/stemma-1.xsd samples/ashworth-family.xml

      # A project site lives under /<repository>/; a user or organisation site (<name>.github.io) at the root.
      - name: Build for GitHub Pages
        run: |
          name="${{ github.event.repository.name }}"
          case "$name" in
            *.github.io) base="/" ;;
            *) base="/$name/" ;;
          esac
          npx ng build --base-href "$base"
          cp dist/stemma/browser/index.html dist/stemma/browser/404.html

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/stemma/browser

  deploy:
    name: Publish to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
