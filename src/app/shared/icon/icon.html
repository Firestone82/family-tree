<svg viewBox="0 0 24 24" [attr.width]="size()" [attr.height]="size()" aria-hidden="true" focusable="false">
  @if (fill()) {
    <path [attr.d]="fill()" fill="currentColor" />
  }
  <path [attr.d]="path()" fill="none" stroke="currentColor" [attr.stroke-width]="stroke()" stroke-linecap="round" stroke-linejoin="round" />
</svg>
