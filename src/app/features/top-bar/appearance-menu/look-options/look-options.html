<div class="field">
  <span class="field-label" id="look-style">{{ t('look.style') }}</span>
  <stemma-segmented
    labelledBy="look-style"
    [compact]="true"
    [options]="styles()"
    [value]="view().style"
    (valueChange)="settingsChange.emit({ style: $event })"
  />
  <span class="hint">{{ styleHint() }}</span>
</div>
<div class="field">
  <span class="field-label" id="look-colour">{{ t('look.colour') }}</span>
  <stemma-segmented
    labelledBy="look-colour"
    [compact]="true"
    [options]="colors()"
    [value]="view().colorBy"
    (valueChange)="settingsChange.emit({ colorBy: $event })"
  />
</div>
<div class="field">
  <span class="field-label" id="look-lines">{{ t('look.lines') }}</span>
  <stemma-segmented
    labelledBy="look-lines"
    [compact]="true"
    [options]="lines()"
    [value]="view().lines"
    (valueChange)="settingsChange.emit({ lines: $event })"
  />
</div>
