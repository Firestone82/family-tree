<button
  type="button"
  class="btn ghost"
  [class.icon]="iconOnly()"
  (click)="ui.toggleMenu('appearance')"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="t('appearance.title')"
>
  <stemma-icon name="sliders" />
  @if (!iconOnly()) {
    <span>{{ t('appearance.title') }}</span>
  }
</button>
@if (open()) {
  <div class="menu" role="dialog" [attr.aria-label]="t('appearance.title')">
    <stemma-look-options [view]="view()" (settingsChange)="set($event)" />
    <stemma-language-options
      [appLanguage]="i18n.code()"
      [chartLanguage]="chartLanguage()"
      (appLanguageChange)="i18n.setLanguage($event)"
      (chartLanguageChange)="set({ language: $event })"
    />
    <stemma-display-options [view]="view()" (settingsChange)="set($event)" />
    @if (view().showTree) {
      <div class="background">
        <span class="field-label">{{ t('background.title') }}</span>
        <stemma-background-picker idPrefix="look-bg" />
      </div>
    }
  </div>
}
