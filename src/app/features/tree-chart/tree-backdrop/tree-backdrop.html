@if (art(); as a) {
  <svg:defs>
    <svg:linearGradient id="stemma-tree-crown" x1="0" y1="0" x2="0" y2="1">
      <svg:stop class="crown-top" offset="0" />
      <svg:stop class="crown-middle" offset="0.6" />
      <svg:stop class="crown-bottom" offset="1" />
    </svg:linearGradient>
  </svg:defs>
  <svg:path class="twigs" [attr.d]="a.twigs" />
  <svg:path class="shade" [attr.d]="a.shade" />
  <svg:path class="body" [attr.d]="a.body" />
  <svg:path class="light" [attr.d]="a.light" />
  <svg:path class="wood" [attr.d]="a.wood" />
  <svg:path class="bark" [attr.d]="a.bark" />
  @for (leaves of a.leaves; track $index) {
    <svg:path class="leaves" [attr.data-tone]="$index" [attr.d]="leaves" />
  }
}
