<div class="quick-actions">
  <button
    type="button"
    class="btn"
    (click)="add.emit('parent')"
    [disabled]="!needsParents()"
    [title]="needsParents() ? t('person.addParent') : t('person.parentsFull')"
  >
    <stemma-icon name="parent" [size]="21" />{{ t('relation.parent') }}
  </button>
  <button type="button" class="btn" (click)="add.emit('partner')"><stemma-icon name="partner" [size]="21" />{{ t('relation.partner') }}</button>
  <button type="button" class="btn" (click)="add.emit('child')"><stemma-icon name="child" [size]="21" />{{ t('relation.child') }}</button>
  <button type="button" class="btn" (click)="add.emit('sibling')"><stemma-icon name="sibling" [size]="21" />{{ t('relation.sibling') }}</button>
</div>
@if (facts().length) {
  <div class="facts">
    @for (f of facts(); track f) {
      <span>{{ f }}</span>
    }
  </div>
}
